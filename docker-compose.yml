services:
  app:
    build: .
    container_name: yard-sale-gold
    # host:container — 5174 is the standardized port (change the LEFT side if it
    # collides with another container on the Synology).
    ports:
      - "5174:5174"
    # Secrets live in `.dev.vars` (same file as local `npm run dev`).
    # Copy `.dev.vars.example` to `.dev.vars` before starting.
    # On Synology Container Manager you can instead set OPENAI_API_KEY in the
    # project environment if you prefer not to keep a file on disk.
    env_file:
      - .dev.vars
    environment:
      - NODE_ENV=production
      - PORT=5174
    volumes:
      - wrangler-state:/app/.wrangler
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  wrangler-state:
